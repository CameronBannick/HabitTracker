<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="ground" cx="50%" cy="42%" r="70%">
      <stop offset="0%"   stop-color="#102F5C"/>
      <stop offset="45%"  stop-color="#08182F"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    <filter id="bloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#ground)"/>

  <g transform="translate(214 214) scale(1.0642857142857143)" filter="url(#bloom)"
